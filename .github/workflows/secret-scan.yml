name: Public secret scan
# Version-Timestamp: 2026-09-16 16:02:15 AST
# Reused by validation so the stable release-checks gate covers this result.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks files and history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the pinned official Gitleaks binary and verify its digest
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          printf 'SCANNER_PATH=%s/gitleaks\n' "$scanner_dir" >> "$GITHUB_ENV"
      - name: Scan checked-out files without uploading findings
        run: '"$SCANNER_PATH" dir --redact --no-banner .'
      - name: Scan all available Git history without uploading findings
        run: '"$SCANNER_PATH" git --redact --no-banner --log-opts="--all" .'
