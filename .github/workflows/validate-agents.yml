name: Validate Template
# Version-Timestamp: 2026-09-16 16:02:15 AST

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wizard-platforms:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run all portable checks and test scripts
        run: python scripts/verify.py

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  release-checks:
    name: release-checks
    if: always()
    needs: [wizard-platforms, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and secret scan to pass
        env:
          PLATFORM_RESULT: ${{ needs.wizard-platforms.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
        run: |
          test "$PLATFORM_RESULT" = success
          test "$SECRET_RESULT" = success
